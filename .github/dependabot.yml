# Dependabot abre un PR cuando sale una versión nueva de una imagen o de una acción.
# El CI lo revisa antes de aceptarlo; en el servidor se aplica con git pull y docker compose up -d.
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Un salto de versión mayor migra los datos y no tiene vuelta atrás: se hace a mano, con copia antes
    ignore:
      - dependency-name: mariadb
        update-types: ["version-update:semver-major"]
      - dependency-name: louislam/uptime-kuma
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
